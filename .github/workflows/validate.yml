name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: |
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run core and smoke tests
        run: npm test
